<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>とまりぐるぐる・じどう工房</title>
<style>
  :root { color-scheme: light dark; }
  body {
    font-family: "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
    max-width: 760px; margin: 0 auto; padding: 24px; line-height: 1.7;
  }
  h1 { font-size: 1.4rem; }
  .card {
    border: 1px solid rgba(128,128,128,.4); border-radius: 12px;
    padding: 20px; margin: 16px 0;
  }
  .drop {
    border: 2px dashed rgba(128,128,128,.6); border-radius: 12px;
    padding: 32px; text-align: center; cursor: pointer;
  }
  .drop.over { border-color: #e07a5f; background: rgba(224,122,95,.08); }
  #preview { max-width: 240px; max-height: 240px; display: block; margin: 12px auto; border-radius: 8px; }
  button {
    font-size: 1rem; padding: 10px 24px; border-radius: 8px; border: none;
    background: #e07a5f; color: #fff; cursor: pointer;
  }
  button:disabled { opacity: .4; cursor: default; }
  ul#steps { list-style: none; padding: 0; }
  ul#steps li { margin: 6px 0; }
  .st-running::before { content: "⏳ "; }
  .st-done::before { content: "✅ "; }
  .st-warn::before { content: "⚠️ "; }
  .detail { opacity: .7; font-size: .85em; margin-left: 1.6em; display: block; }
  .error { color: #c0392b; white-space: pre-wrap; }
  a.viewer-link { font-size: 1.1rem; font-weight: bold; }
  .sheets { display: flex; flex-wrap: wrap; gap: 8px; }
  .sheets img { width: 110px; border-radius: 6px; border: 1px solid rgba(128,128,128,.3); }
</style>
</head>
<body>
<h1>とまりぐるぐる・じどう工房</h1>
<p>キャラクターの一枚絵をアップロードすると、<b>上半身入りのアバター素材</b>（5×5方向 × 6表情のスプライトシート）を自動生成して、マウス追従・まばたき・リップシンクするアバターにします。</p>

<div class="card">
  <div class="drop" id="drop">
    ここに画像をドロップ、またはクリックして選択<br>
    <small>PNG / JPEG / WebP（15MBまで）</small>
    <img id="preview" hidden>
  </div>
  <input type="file" id="file" accept="image/png,image/jpeg,image/webp" hidden>
  <p style="text-align:center"><button id="go" disabled>アバターを自動生成する</button></p>
</div>

<div class="card" id="progress" hidden>
  <h2 style="font-size:1.1rem">生成の進みぐあい</h2>
  <ul id="steps"></ul>
  <p class="error" id="error" hidden></p>
  <div id="result" hidden>
    <p>🎉 できあがり！ → <a class="viewer-link" id="viewerLink" target="_blank">アバターを開く</a></p>
    <div class="sheets" id="sheets"></div>
  </div>
</div>

<script>
const drop = document.getElementById("drop");
const fileInput = document.getElementById("file");
const preview = document.getElementById("preview");
const goBtn = document.getElementById("go");
let selectedFile = null;

drop.addEventListener("click", () => fileInput.click());
drop.addEventListener("dragover", (e) => { e.preventDefault(); drop.classList.add("over"); });
drop.addEventListener("dragleave", () => drop.classList.remove("over"));
drop.addEventListener("drop", (e) => {
  e.preventDefault(); drop.classList.remove("over");
  if (e.dataTransfer.files[0]) setFile(e.dataTransfer.files[0]);
});
fileInput.addEventListener("change", () => {
  if (fileInput.files[0]) setFile(fileInput.files[0]);
});

function setFile(f) {
  selectedFile = f;
  preview.src = URL.createObjectURL(f);
  preview.hidden = false;
  goBtn.disabled = false;
}

goBtn.addEventListener("click", async () => {
  goBtn.disabled = true;
  document.getElementById("progress").hidden = false;
  document.getElementById("error").hidden = true;
  document.getElementById("result").hidden = true;

  const fd = new FormData();
  fd.append("image", selectedFile);
  try {
    const res = await fetch("/api/generate", { method: "POST", body: fd });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "アップロードに失敗しました");
    poll(data.jobId);
  } catch (err) {
    showError(err.message);
  }
});

function showError(msg) {
  const el = document.getElementById("error");
  el.textContent = "エラー: " + msg;
  el.hidden = false;
  goBtn.disabled = false;
}

async function poll(jobId) {
  const stepsEl = document.getElementById("steps");
  const timer = setInterval(async () => {
    try {
      const res = await fetch(`/api/job/${jobId}`);
      const job = await res.json();
      stepsEl.innerHTML = "";
      for (const s of job.steps) {
        const li = document.createElement("li");
        li.className = "st-" + s.status;
        li.textContent = s.label;
        if (s.detail) {
          const d = document.createElement("span");
          d.className = "detail";
          d.textContent = s.detail;
          li.appendChild(d);
        }
        stepsEl.appendChild(li);
      }
      if (job.status === "error") {
        clearInterval(timer);
        showError(job.error);
      } else if (job.status === "done") {
        clearInterval(timer);
        goBtn.disabled = false;
        const r = document.getElementById("result");
        r.hidden = false;
        document.getElementById("viewerLink").href = job.result.viewerUrl;
        const sheetsEl = document.getElementById("sheets");
        sheetsEl.innerHTML = "";
        for (const url of job.result.sheets) {
          const img = document.createElement("img");
          img.src = url;
          sheetsEl.appendChild(img);
        }
      }
    } catch (_) { /* 次のポーリングで再試行 */ }
  }, 1500);
}
</script>
</body>
</html>
